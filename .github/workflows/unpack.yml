name: unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source from zip
        run: |
          unzip -q realistic-android-game.zip -x 'realistic-android-game/.github/*'
          cp -a realistic-android-game/. .
          rm -rf realistic-android-game realistic-android-game.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack game source and tests"
          git push
